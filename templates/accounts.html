{% extends "base.html" %}{% block content %}<h1>Chart of Accounts</h1><section class="panel"><form method="post" class="grid"><input name="name" placeholder="Account Name *" required><input name="group_name" value="Other" placeholder="Group"><input name="opening" type="number" step=".01" placeholder="Opening"><select name="opening_type"><option>Dr</option><option>Cr</option></select><button class="btn">Add Account</button></form></section><section class="panel"><table><tr><th>Account</th><th>Group</th><th>Opening</th><th>Ledger</th></tr>{% for a in accounts %}<tr><td>{{a.name}}</td><td>{{a.group_name}}</td><td>{{a.opening}} {{a.opening_type}}</td><td><a href="/ledger/{{a.id}}">View</a></td></tr>{% endfor %}</table></section>{% endblock %}
