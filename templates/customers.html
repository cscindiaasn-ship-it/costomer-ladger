{% extends "base.html" %}{% block content %}<h1>Customer Master</h1><form method="post" class="form"><input name="code" placeholder="Customer ID" required><input name="name" placeholder="Customer Name" required><input name="mobile" placeholder="Mobile"><input name="address" placeholder="Address"><input name="opening" type="number" step="0.01" placeholder="Opening Balance"><select name="opening_type"><option>Debit</option><option>Credit</option></select><button>Add Customer</button></form><table><tr><th>ID</th><th>Name</th><th>Mobile</th><th>Ledger</th></tr>{% for c in customers %}<tr><td>{{c.code}}</td><td>{{c.name}}</td><td>{{c.mobile}}</td><td><a href="/customer/{{c.id}}">Open</a></td></tr>{% endfor %}</table>{% endblock %}
