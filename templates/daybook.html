{% extends "base.html" %}{% block content %}<div class="top"><h1>Day Book</h1><a class="btn" href="/export">Export CSV</a></div><section class="panel"><table><tr><th>Date</th><th>No.</th><th>Type</th><th>Party</th><th>Amount</th><th>Mode</th><th>Narration</th></tr>{% for r in rows %}<tr><td>{{r.vdate}}</td><td>{{r.vno}}</td><td>{{r.vtype}}</td><td>{{r.party or '-'}}</td><td>₹ {{'%.2f'|format(r.amount)}}</td><td>{{r.mode}}</td><td>{{r.narration}}</td></tr>{% endfor %}</table></section>{% endblock %}
