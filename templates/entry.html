{% extends "base.html" %}{% block content %}<h1>New Entry — {{customer.name}}</h1><form method="post" class="form"><input name="txn_date" type="date" value="{{today}}" required><input name="voucher" placeholder="Voucher No."><input name="particulars" placeholder="Particulars" required><input name="debit" type="number" step="0.01" placeholder="Debit / उधार"><input name="credit" type="number" step="0.01" placeholder="Credit / जमा"><select name="payment_mode"><option>Cash</option><option>UPI</option><option>Bank</option><option>Cheque</option><option>Other</option></select><input name="notes" placeholder="Notes"><button>Save Entry</button></form>{% endblock %}
