{% extends "base.html" %}{% block content %}<div class="top"><h1>Party Outstanding</h1><button class="btn" onclick="print()">Print</button></div><section class="panel"><table><tr><th>Party</th><th>Phone</th><th>Outstanding</th><th>Ledger</th></tr>{% for a,b in rows %}<tr><td>{{a.name}}</td><td>{{a.phone}}</td><td>₹ {{'%.2f'|format(b|abs)}} {{'Dr' if b>=0 else 'Cr'}}</td><td><a href="/ledger/{{a.id}}">View</a></td></tr>{% endfor %}</table></section>{% endblock %}
