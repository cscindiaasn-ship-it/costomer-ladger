{% extends "base.html" %}{% block content %}<div class="top"><h1>Party Master</h1><a class="btn" href="/voucher/Receipt">Receipt</a></div><section class="panel"><form method="post" class="grid"><input name="name" placeholder="Party Name *" required><input name="phone" placeholder="Mobile"><input name="gstin" placeholder="GSTIN"><input name="group_name" value="Sundry Debtors" placeholder="Group"><input name="opening" type="number" step=".01" placeholder="Opening"><select name="opening_type"><option>Dr</option><option>Cr</option></select><input name="address" placeholder="Address"><button class="btn">Save Party</button></form></section><section class="panel"><table><tr><th>Party</th><th>Phone</th><th>GSTIN</th><th>Opening</th><th>Ledger</th></tr>{% for p in parties %}<tr><td>{{p.name}}</td><td>{{p.phone}}</td><td>{{p.gstin}}</td><td>{{p.opening}} {{p.opening_type}}</td><td><a href="/ledger/{{p.id}}">View</a></td></tr>{% endfor %}</table></section>{% endblock %}
