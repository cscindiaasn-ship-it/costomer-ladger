{% extends "base.html" %}{% block content %}<div class="top"><h1>Trial Balance</h1><button class="btn" onclick="print()">Print</button></div><section class="panel"><table><tr><th>Account</th><th>Group</th><th>Balance</th><th>Type</th></tr>{% for a,b in data %}<tr><td>{{a.name}}</td><td>{{a.group_name}}</td><td>₹ {{'%.2f'|format(b|abs)}}</td><td>{{'Dr' if b>=0 else 'Cr'}}</td></tr>{% endfor %}</table></section>{% endblock %}
