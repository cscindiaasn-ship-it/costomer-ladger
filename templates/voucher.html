{% extends "base.html" %}{% block content %}<h1>{{vtype}} Voucher</h1><section class="panel"><form method="post"><div class="grid"><label>Date<input type="date" name="vdate" value="{{today}}"></label><label>Party<select name="party_id" required><option value="">Select Party</option>{% for p in parties %}<option value="{{p.id}}">{{p.name}}</option>{% endfor %}</select></label><label>Amount<input name="amount" type="number" step=".01" min=".01" required></label><label>Mode<select name="mode"><option>Cash</option><option>Bank</option></select></label></div><textarea name="narration" placeholder="Narration"></textarea><button class="btn">Save Voucher</button></form></section>{% endblock %}
